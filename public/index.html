<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control</title>
<link rel="stylesheet" href="/shell.css">
<link rel="stylesheet" href="/shared.css">
</head>
<body>
  <!--
    The nav is the one piece of chrome every panel shares, so it is the one place the
    dashboard's SHAPE is stated: five groups, one glyph per module, in the order you reach
    for them across a day. The glyphs are inline SVG in currentColor -- eighteen tiny
    paths -- rather than emoji, because emoji render in whatever colour font the OS ships
    and no two of them sit on the same baseline; the earlier list had ▤ and ◫ each doing
    duty for two different modules. Every data-panel value below is a key of PANELS in
    shell.js; shell.js reads nothing else from this markup (.nav-item, data-panel, .active).
  -->
  <div class="shell">
    <nav class="sidebar" aria-label="Modules">
      <a class="brand" href="/#focus" aria-label="Mission Control, home">
        <span class="brand-mark" aria-hidden="true">MC</span>
        <span class="brand-text">
          <span class="brand-name">Mission Control</span>
          <!-- Derived, never typed: the machine's own clock, where the eye already lands. -->
          <span class="brand-sub"><span id="sideDate"></span><span class="brand-dot" aria-hidden="true">·</span><span id="sideClock">--:--</span></span>
        </span>
      </a>

      <ul class="nav-list" id="navList">
        <li class="nav-group"><span class="nav-label">Today</span></li>
        <li><button class="nav-item active" data-panel="focus">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8.5" r="5.5"/><path d="M8 5.5v3l2 1.5M6 1.5h4"/></svg></span>Focus
        </button></li>
        <li><button class="nav-item" data-panel="schedule">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg></span>Schedule
        </button></li>
        <li><button class="nav-item" data-panel="reports">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13.5V8M8 13.5V3M13 13.5V6"/></svg></span>Reports
        </button></li>

        <li class="nav-group"><span class="nav-label">Money</span></li>
        <li><button class="nav-item" data-panel="finance">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="4" width="13" height="8.5" rx="1.8"/><circle cx="8" cy="8.25" r="1.9"/><path d="M4 8.25h.01M12 8.25h.01"/></svg></span>Money
        </button></li>
        <li><button class="nav-item" data-panel="budget">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 2v6l4.2 4.2"/></svg></span>Budget
        </button></li>
        <li><button class="nav-item" data-panel="income">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l4-4 3 3 5-5.5"/><path d="M10 5.5h4v4"/></svg></span>Income
        </button></li>

        <li class="nav-group"><span class="nav-label">Work</span></li>
        <li><button class="nav-item" data-panel="projects">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4.5A1.5 1.5 0 0 1 3 3h3l1.5 1.5H13A1.5 1.5 0 0 1 14.5 6v6A1.5 1.5 0 0 1 13 13.5H3A1.5 1.5 0 0 1 1.5 12z"/></svg></span>Projects
        </button></li>
        <li><button class="nav-item" data-panel="goals">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="3"/><circle cx="8" cy="8" r=".6"/></svg></span>Goals
        </button></li>
        <li><button class="nav-item" data-panel="work">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1.8"/><path d="M4.5 6.5l2 1.5-2 1.5M8 9.5h3.5"/></svg></span>Work
        </button></li>
        <li><button class="nav-item" data-panel="mail">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="9" rx="1.8"/><path d="M2 4.5l6 4.5 6-4.5"/></svg></span>Mail
        </button></li>

        <li class="nav-group"><span class="nav-label">Life</span></li>
        <li><button class="nav-item" data-panel="lifestyle">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8l6-5.5L14 8"/><path d="M3.5 7v6.5h9V7"/><path d="M6.5 13.5V10h3v3.5"/></svg></span>Lifestyle
        </button></li>
        <li><button class="nav-item" data-panel="exercise">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8.5h3l1.5-4 3 7 1.5-3h4"/></svg></span>Exercise
        </button></li>
        <li><button class="nav-item" data-panel="wellbeing">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.5S2 9.8 2 5.9A3 3 0 0 1 8 4.6a3 3 0 0 1 6 1.3c0 3.9-6 7.6-6 7.6z"/></svg></span>Wellbeing
        </button></li>
        <li><button class="nav-item" data-panel="brain">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5c-1.2-1-3-1.2-5-.8v9.6c2-.4 3.8-.2 5 .8 1.2-1 3-1.2 5-.8V2.7c-2-.4-3.8-.2-5 .8z"/><path d="M8 3.5v9.6"/></svg></span>Second brain
        </button></li>

        <li class="nav-group"><span class="nav-label">System</span></li>
        <li><button class="nav-item" data-panel="safety">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8l5.5 2v4.4c0 3.2-2.3 5.4-5.5 6.5-3.2-1.1-5.5-3.3-5.5-6.5V3.8z"/><path d="M5.7 8.2l1.6 1.6 3.1-3.3"/></svg></span>Safety
        </button></li>
        <li><button class="nav-item" data-panel="atlas">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 4l4-1.7 5 1.7 4-1.7v9.7l-4 1.7-5-1.7-4 1.7z"/><path d="M5.5 2.3v9.7M10.5 4v9.7"/></svg></span>Atlas
        </button></li>
        <li><button class="nav-item" data-panel="browsing">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M2 8h12M8 2c2 2 2 10 0 12M8 2c-2 2-2 10 0 12"/></svg></span>Browsing
        </button></li>
        <li><button class="nav-item" data-panel="machine">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="3.5" width="11" height="7" rx="1"/><path d="M5.5 13h5M8 10.5V13"/></svg></span>Machine
        </button></li>

        <li class="nav-group nav-group-last"><a class="nav-item nav-link" href="/garage/">
          <span class="nav-icon"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.6 4.4a3.4 3.4 0 0 1-4.5 4.5l-5.3 5.3a1.3 1.3 0 0 1-1.9-1.9L7.2 7a3.4 3.4 0 0 1 4.5-4.5L9.6 4.6l1.8 1.8z"/></svg></span>The Garage
        </a></li>
      </ul>

    </nav>
    <main class="content">
      <div id="panelRoot"></div>
    </main>
  </div>

  <script type="module" src="/shell.js"></script>
  <script>
    (function () {
      var c = document.getElementById('sideClock'), d = document.getElementById('sideDate');
      if (!c || !d) return;
      function tick() {
        var n = new Date();
        c.textContent = n.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        d.textContent = n.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
      }
      tick();
      // Re-align to the minute boundary once, then every 60 s, so the readout never sits a
      // stale 59 s behind the taskbar clock.
      setTimeout(function () { tick(); setInterval(tick, 60000); }, 60000 - (Date.now() % 60000));
    })();
  </script>
</body>
</html>
