<body>
  <!--
    The nav is the one piece of chrome every panel shares, so it is the one place the
    dashboard's SHAPE is stated: five groups, one glyph per module, in the order you reach
    for them across a day. The glyphs are inline SVG in currentColor -- eighteen tiny
    paths -- rather than emoji, because emoji render in whatever colour font the OS ships
    and no two of them sit on the same baseline; the earlier list had ▤ and ◫ each doing
    duty for two different modules. Every data-panel value below is a key of PANELS in
    shell.js; shell.js reads nothing else from this markup (.nav-item, data-panel, .active).
  -->

          <!-- Derived, never typed: the machine's own clock, where the eye already lands. -->
          <span class="brand-sub"><span id="sideDate"></span><span class="brand-dot" aria-hidden="true">·</span><span id="sideClock">--:--</span></span>
        </span>
      </a>

  <script>
    (function () {
      var c = document.getElementById('sideClock'), d = document.getElementById('sideDate');
      if (!c || !d) return;
      function tick() {
        var n = new Date();
        c.textContent = n.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        d.textContent = n.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' });
      }
      tick();
      // Re-align to the minute boundary once, then every 60 s, so the readout never sits a
      // stale 59 s behind the taskbar clock.
      setTimeout(function () { tick(); setInterval(tick, 60000); }, 60000 - (Date.now() % 60000));
    })();
  </script>
